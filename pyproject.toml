[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-shared"
version = "0.1.0"
description = "Shared schemas, enums, constants, exceptions, and utilities for AgentForge services."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/your-org/agentforge-shared"
Repository = "https://github.com/your-org/agentforge-shared"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentforge_shared*"]